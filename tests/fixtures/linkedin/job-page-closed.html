<!doctype html>
<!--
  A sanitized copy of a LinkedIn job's detail pane for a job that no longer takes applications (PLAN.md Phase 11
  task 12, §8.2): the search page opened with ?currentJobId=4490000006, cut down to the pane's top card. The company,
  job and tracking query values are made up; everything else on the page is removed.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Patient Care Lead | Example Labs | LinkedIn</title>
  </head>
  <body>
    <div class="jobs-search__job-details--wrapper">
      <div class="jobs-search__job-details--container">
        <div class="job-details-jobs-unified-top-card__container--two-pane">
          <div class="job-details-jobs-unified-top-card__company-name" dir="ltr">
            <a target="_self" href="https://www.linkedin.com/company/example-labs/life">Example Labs</a>
          </div>
          <div class="t-24 job-details-jobs-unified-top-card__job-title">
            <h1 class="t-24 t-bold inline">
              <a href="/jobs/view/4490000006/?alternateChannel=search&amp;trackingId=FFFF%3D%3D" class="ember-view"
                >Patient Care Lead</a
              >
            </h1>
          </div>
          <div class="job-details-jobs-unified-top-card__primary-description-container">
            <div class="t-black--light mt2 job-details-jobs-unified-top-card__tertiary-description-container">
              <span dir="ltr"
                ><span class="tvm__text tvm__text--low-emphasis">United States</span
                ><span class="tvm__text tvm__text--low-emphasis"
                  ><span class="white-space-pre"> </span>·<span class="white-space-pre"> </span></span
                ><span class="tvm__text tvm__text--low-emphasis">5 hours ago</span
                ><span class="tvm__text tvm__text--low-emphasis"
                  ><span class="white-space-pre"> </span>·<span class="white-space-pre"> </span></span
                ><span class="tvm__text tvm__text--low-emphasis">Over 100 applicants</span></span
              >
            </div>
          </div>
          <div class="job-details-fit-level-preferences">
            <button tabindex="0" class="artdeco-button artdeco-button--secondary artdeco-button--muted" type="button">
              <span class="tvm__text tvm__text--low-emphasis"><strong>Remote</strong></span>
            </button>
          </div>
          <div class="mt5">
            <div class="artdeco-inline-feedback artdeco-inline-feedback--error" role="alert">
              <span class="artdeco-inline-feedback__message"> No longer accepting applications </span>
            </div>
          </div>
        </div>
        <div class="jobs-description">
          <div class="jobs-box__html-content" id="job-details" tabindex="-1">
            <h2 class="text-heading-large">About the job</h2>
            <p>Lead our patient care group across web and mobile.</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
