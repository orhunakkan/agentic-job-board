# CI for the Agentic Job Board (PLAN.md Phase 7 task 4), staged fast to slow:
#   static (typecheck, lint, format, audit, unit) → vitest (every Vitest project with coverage thresholds:
#   integration, API, contract, security, DEC-021) → browsers (Playwright E2E on 4 projects, then smoke) and, next
#   to it, bdd (the Cucumber scenarios: integration, API, E2E on 4 browsers, then smoke; DEC-056)
#   → perf (k6 load test against 5,000 seeded jobs, DEC-040)
#   → board-report (every job's results in one report, PLAN.md Phase 14, DEC-058).
# Every job runs its tests through scripts/board-report.ts with BOARD_REPORT_APPEND=1, so it only keeps its results in
# reports/test-results/ and uploads them, even after a failure; the last job builds the report from all of them.
# Jobs run on the owner's self-hosted runner when the repository variable CI_RUNNER names its label (DEC-039),
# otherwise on GitHub's ubuntu-26.04, pinned rather than ubuntu-latest so an image migration never changes CI unannounced.
# Pull requests from forks always go to GitHub's runners, so code from outside never runs on the owner's laptop.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  BOARD_REPORT_APPEND: '1'

jobs:
  static:
    name: Static checks and unit tests
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-26.04') || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # typecheck, lint, format and audit, each as results of its own (PLAN.md Phase 14 task 12).
      - run: npm run test:static
      - run: npm run test:unit
        if: ${{ !cancelled() }}
      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-static
          path: reports/test-results/
          retention-days: 14

  vitest:
    name: Integration, API, contract and security tests (with coverage)
    needs: static
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-26.04') || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    # The integration tests open saved copies of LinkedIn's pages in Chromium (scripts/search-linkedin.ts, Phase 11),
    # so this job runs in the same Playwright image as the browser job below.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Every Vitest project at once, so the coverage thresholds see all of them (DEC-021).
      - run: npm run test:coverage
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-vitest
          path: reports/test-results/
          retention-days: 14

  browsers:
    name: E2E, accessibility and smoke (Playwright)
    needs: vitest
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-26.04') || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    # Browsers and their system libraries come preinstalled, so no slow apt mirror can stall the job (DEF-014).
    # The tag must equal the installed @playwright/test version (tests/unit/toolchain.test.ts checks it).
    # Firefox refuses to run as root under a different HOME, hence the runner's own user
    # (UID 1001 on GitHub's runners, and the self-hosted runner's gh-runner user is created with the same UID).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - run: npm run test:smoke
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-browsers
          path: reports/test-results/
          retention-days: 14

  bdd:
    name: Cucumber BDD (integration, API, E2E, smoke)
    needs: vitest
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-26.04') || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    # The E2E scenarios drive the same Playwright browsers as the job above, so they run in the same image and user.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Runs every profile even when one fails (scripts/bdd.ts), so one failure doesn't hide the other suites.
      - run: npm run test:bdd
      - run: npm run test:bdd:smoke
        if: ${{ !cancelled() }}
      - name: Upload the Cucumber reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: reports/cucumber/
          retention-days: 14
      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-bdd
          path: reports/test-results/
          retention-days: 14

  perf:
    name: Load test (k6)
    # Last, so a functional failure is reported before the two minutes the load test takes.
    needs: [browsers, bdd]
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-26.04') || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    env:
      PORT: '3000'
      DB_PATH: perf/perf.db
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
      - run: node scripts/seed.ts --count 5000 --db "$DB_PATH"
      - name: Start the app on the seeded database
        run: |
          node src/main.ts > app.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health && exit 0; sleep 1; done
          cat app.log
          exit 1
      - run: npm run test:perf
      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-perf
          path: reports/test-results/
          retention-days: 14

  board-report:
    name: board-report (every test type)
    # After every other job, and even when one failed or was skipped, so a failure is in the report too.
    needs: [static, vitest, browsers, bdd, perf]
    if: ${{ !cancelled() }}
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-26.04') || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Only so the report's environment names the k6 version the perf job used.
      - uses: grafana/setup-k6-action@v1
      - name: Download every job's test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: reports/test-results/
          merge-multiple: true
      - name: Restore the history behind the trends
        uses: actions/cache/restore@v6
        with:
          path: reports/board-report-history.jsonl
          key: board-report-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: board-report-history-
      # Builds reports/board-report/ and writes the totals by type and the failures to this run's summary page.
      - run: node scripts/board-report.ts build
      - name: Upload board-report
        uses: actions/upload-artifact@v7
        with:
          name: board-report
          path: reports/board-report/
          retention-days: 14
      - name: Save the history
        uses: actions/cache/save@v6
        with:
          path: reports/board-report-history.jsonl
          key: board-report-history-${{ github.run_id }}-${{ github.run_attempt }}
